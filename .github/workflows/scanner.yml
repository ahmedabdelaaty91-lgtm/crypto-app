name: Crypto Spot Scanner 24/7 & Daily Reporter

on:
  schedule:
    # 03:07 فجراً، 07:07 صباحاً، 11:07 ظهراً، 03:07 عصراً، 07:07 مساءً، 11:07 ليلاً بتوقيت القاهرة
    - cron: '7 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  scan_and_report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Scanner & Alerts
        run: |
          python scanner.py --once --notify

      - name: Save & Commit Trades Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trades_data.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update active trades [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi
