name: Auto Trend Lines 4H Scanner

on:
  schedule:
    # يعمل أوتوماتيك كل 4 ساعات بتوقيت مصر (بعد إغلاق كل شمعة 4 ساعات):
    # 03:07 فجراً | 07:07 صباحاً | 11:07 ظهراً | 03:07 عصراً | 07:07 مساءً | 11:07 ليلاً
    - cron: '7 0,4,8,12,16,20 * * *'
  workflow_dispatch: # زر لتشغيله يدوياً للتجربة في أي وقت

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy

      - name: Run 4H Trendline Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python auto_trendline_scanner.py --once --notify --token "$TELEGRAM_BOT_TOKEN" --chat "$TELEGRAM_CHAT_ID"
