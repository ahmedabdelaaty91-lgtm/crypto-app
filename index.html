    // ==========================================
    // 4. PRICE FORMATTER
    // ==========================================
    function formatPrice(val, currency = "$") {
      if (!val) return "0.00";
      const abs = Math.abs(val);
      let formatted = "";
      if (abs >= 1000) formatted = val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      else if (abs >= 1) formatted = val.toFixed(2);
      else if (abs >= 0.01) formatted = val.toFixed(4);
      else formatted = val.toFixed(8).replace(/0+$/, '');
      return `${formatted} ${currency}`;
    }

    // ==========================================
    // 5. RENDER FUNCTIONS
    // ==========================================
    function renderTimeframePills() {
      const container = document.getElementById('tfPillsContainer');
      container.innerHTML = '';

      const tfs = currentMarket === 'crypto' 
        ? [{ id: 'all', label: 'الكل' }, { id: '4h', label: 'فريم 4 ساعات (4H)' }, { id: '1d', label: 'فريم اليوم (1D)' }]

      tfs.forEach(tf => {
        const btn = document.createElement('button');
        const isActive = currentTf === tf.id;
        btn.className = `px-3 py-1 rounded-full whitespace-nowrap transition-all ${
          isActive 
            ? 'bg-emerald-500 text-gray-950 shadow-md font-black' 
            : 'bg-gray-900 border border-gray-800 text-slate-400 hover:text-white'
        }`;
        btn.textContent = tf.label;
        btn.onclick = () => {
          currentTf = tf.id;
          renderTimeframePills();
          renderSignals();
        };
        container.appendChild(btn);
      });
    }

          </div>

          <!-- Strategy Description -->
          <div class="bg-gray-950/70 rounded-2xl p-2.5 border border-gray-800/80 mb-3 text-[11px] space-y-1">
            <div class="text-emerald-400 font-bold flex items-center gap-1">
              <span>🎯</span> <span>${sig.strategy}</span>
            </div>
            <p class="text-slate-400 text-[10px] leading-relaxed">${sig.reason}</p>
          </div>

          <!-- Price & Targets Grid -->
          <div class="grid grid-cols-4 gap-1.5 text-center mb-3">
            <div class="bg-gray-900/60 p-2 rounded-xl border border-gray-800/80">
              <div class="text-[9px] text-slate-400 font-bold">الدخول</div>
              <div class="text-xs font-black text-white">${formatPrice(sig.entry, currency)}</div>
            </div>
            <div class="bg-rose-950/20 p-2 rounded-xl border border-rose-500/20">
              <div class="text-[9px] text-rose-400 font-bold">الوقف الفني</div>
              <div class="text-xs font-black text-rose-300">${formatPrice(sig.sl, currency)}</div>
              <div class="text-[9px] text-rose-400 font-bold">${sig.slPct}%</div>
            </div>
            <div class="bg-emerald-950/20 p-2 rounded-xl border border-emerald-500/20">
              <div class="text-[9px] text-emerald-400 font-bold">الهدف 1</div>
              <div class="text-xs font-black text-emerald-300">${formatPrice(sig.tp1, currency)}</div>
              <div class="text-[9px] text-emerald-400 font-bold">+${sig.tp1Pct}%</div>
            </div>
            <div class="bg-emerald-950/40 p-2 rounded-xl border border-emerald-500/40">
              <div class="text-[9px] text-emerald-400 font-bold">الهدف 2</div>
              <div class="text-xs font-black text-emerald-200">${formatPrice(sig.tp2, currency)}</div>
              <div class="text-[9px] text-emerald-400 font-bold">+${sig.tp2Pct}%</div>
            </div>
          </div>

          <!-- Action Button -->
          <div class="flex items-center gap-2">
            ${currentMarket === 'crypto' 
              ? `<a href="https://www.binance.com/en/trade/${sig.symbol}_USDT?type=spot" target="_blank" class="flex-1 py-2 bg-gradient-to-r from-emerald-500 to-teal-400 hover:opacity-90 text-gray-950 font-black rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-md">
                   <span>تداول مباشر على بينانس</span> ↗
                 </a>`
              : `<a href="https://www.tradingview.com/chart/?symbol=EGX:${sig.symbol}" target="_blank" class="flex-1 py-2 bg-gradient-to-r from-cyan-500 to-blue-500 hover:opacity-90 text-gray-950 font-black rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-md">
                   <span>عرض الشارت الفني (TradingView)</span> ↗
                 </a>`
            }
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ==========================================
    // 6. MARKET SWITCHER
    // ==========================================
    function switchMarket(m) {
      currentMarket = m;
      currentTf = 'all';

      const btnCrypto = document.getElementById('btnMarketCrypto');
      const btnEgx = document.getElementById('btnMarketEgx');

      if (m === 'crypto') {
        btnCrypto.className = "py-2 rounded-xl bg-emerald-500 text-gray-950 transition-all flex items-center justify-center gap-1.5 shadow-md";
        btnEgx.className = "py-2 rounded-xl text-slate-400 hover:text-white transition-all flex items-center justify-center gap-1.5";
      } else {
        btnEgx.className = "py-2 rounded-xl bg-cyan-500 text-gray-950 transition-all flex items-center justify-center gap-1.5 shadow-md";
        btnCrypto.className = "py-2 rounded-xl text-slate-400 hover:text-white transition-all flex items-center justify-center gap-1.5";
      }

      updateSelectedCountBadge();
      renderTimeframePills();
      renderMarketHealth();
      renderSignals();
    }

    function updateSelectedCountBadge() {
      const badge = document.getElementById('selectedCountBadge');
      const selected = currentMarket === 'crypto' ? selectedCrypto : selectedEgx;
      const total = currentMarket === 'crypto' ? CRYPTO_COINS.length : EGX_STOCKS.length;

      if (selected.length === total) {
        badge.textContent = "الكل";
      } else {
        badge.textContent = `${selected.length}/${total}`;
      }
    }

    // ==========================================
    // 7. ASSET SELECTION MODAL
    // ==========================================
    function openAssetModal() {
      const modal = document.getElementById('assetModal');
      const title = document.getElementById('modalTitle');
      title.textContent = currentMarket === 'crypto' ? "تخصيص عملات بينانس المتابعة" : "تخصيص أسهم البورصة المصرية المتابعة";
      renderAssetCheckboxes();
      modal.classList.remove('hidden');
    }

    function closeAssetModal() {
      document.getElementById('assetModal').classList.add('hidden');
    }

    function renderAssetCheckboxes(filterText = '') {
      const container = document.getElementById('assetCheckboxList');
      container.innerHTML = '';

      const items = currentMarket === 'crypto'
        ? CRYPTO_COINS.map(c => ({ code: c, name: `${c} / USDT`, meta: "بينانس" }))
        : EGX_STOCKS.map(s => ({ code: s.code, name: s.name, meta: s.sector }));

      const selected = currentMarket === 'crypto' ? selectedCrypto : selectedEgx;

      items
        .filter(item => item.code.toLowerCase().includes(filterText.toLowerCase()) || item.name.includes(filterText))
        .forEach(item => {
          const isChecked = selected.includes(item.code);
          const row = document.createElement('label');
          row.className = "flex items-center justify-between p-2.5 rounded-xl bg-gray-950/60 border border-gray-800/60 cursor-pointer hover:bg-gray-800/60 transition-all";
          row.innerHTML = `
            <div class="flex items-center gap-2.5">
              <input type="checkbox" value="${item.code}" ${isChecked ? 'checked' : ''} class="w-4 h-4 rounded text-emerald-500 focus:ring-0 bg-gray-900 border-gray-700">
              <div>
                <span class="text-xs font-extrabold text-white">${item.code}</span>
                <span class="text-[11px] text-slate-400 mr-2">${item.name}</span>
              </div>
            </div>
            <span class="text-[10px] text-slate-500 font-bold bg-gray-900 px-2 py-0.5 rounded-full">${item.meta}</span>
          `;
          container.appendChild(row);
        });
    }

    function filterAssetList() {
      const q = document.getElementById('assetSearchInput').value;
      renderAssetCheckboxes(q);
    }

    function toggleSelectAllAssets() {
      const checkboxes = document.querySelectorAll('#assetCheckboxList input[type="checkbox"]');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      checkboxes.forEach(cb => cb.checked = !allChecked);
    }

    function saveAssetSelection() {
      const checkboxes = document.querySelectorAll('#assetCheckboxList input[type="checkbox"]');
      const selected = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

      if (currentMarket === 'crypto') {
        selectedCrypto = selected;
        localStorage.setItem('selected_crypto', JSON.stringify(selectedCrypto));
      } else {
        selectedEgx = selected;
        localStorage.setItem('selected_egx', JSON.stringify(selectedEgx));
      }

      updateSelectedCountBadge();
      renderSignals();
      closeAssetModal();
    }

    // ==========================================
    // 8. PWA INSTALL LOGIC
    // ==========================================
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            document.getElementById('installBanner').classList.add('hidden');
          }
          deferredPrompt = null;
        });
      }
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // ==========================================
    // 9. INITIALIZATION
    // ==========================================
    switchMarket('crypto');
  </script>
</body>
</html>
